{% extends "base.html" %}
{% block title %}Log In — 24sevendelivery{% endblock %}
{% block content %}

<section class="auth-page">
  <div class="container">
    <div class="auth-card">
      <div class="auth-card__icon">✦</div>
      <h1 class="auth-card__title">Welcome Back</h1>
      <p class="auth-card__sub">Log in to continue.</p>

      {% if error %}
      <div class="auth-error">{{ error }}</div>
      {% endif %}

      <form method="post" action="{{ url_for('login') }}" class="auth-form">
        <input type="hidden" name="next" value="{{ next_url }}" />
        <div class="auth-form__group">
          <label class="auth-form__label">Email Address</label>
          <input type="email" name="email" class="auth-form__input" required placeholder="jane@example.com" autofocus />
        </div>
        <div class="auth-form__group">
          <label class="auth-form__label">Password</label>
          <input type="password" name="password" class="auth-form__input" required placeholder="Your password" />
        </div>
        <p class="auth-form__forgot"><a href="{{ url_for('forgot_password') }}">Forgot your password?</a></p>
        <button type="submit" class="auth-form__submit">Log In →</button>
      </form>

      <p class="auth-card__footer">
        Don't have an account? <a href="{{ url_for('signup', next=next_url) }}">Sign up</a>
      </p>
    </div>
  </div>
</section>

<style>
  .auth-page { padding: 4rem 0 5rem; }
  .auth-card {
    max-width: 440px;
    margin: 0 auto;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.06);
    border: 1px solid #eee;
    padding: 2.5rem 2.25rem;
    text-align: center;
  }
  .auth-card__icon {
    width: 52px; height: 52px;
    border-radius: 50%;
    background: #faf5ea;
    color: #b8934a;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.4rem;
    margin: 0 auto 1rem;
  }
  .auth-card__title { font-size: 1.75rem; font-weight: 700; margin-bottom: 0.4rem; }
  .auth-card__sub { color: #6b6b6b; font-size: 0.98rem; margin-bottom: 1.75rem; }
  .auth-error {
    background: #fdecec;
    color: #c0392b;
    border: 1px solid #f5c6c6;
    border-radius: 8px;
    padding: 0.75rem 1rem;
    font-size: 0.9rem;
    margin-bottom: 1.25rem;
    text-align: left;
  }
  .auth-form { text-align: left; }
  .auth-form__group { margin-bottom: 1.1rem; }
  .auth-form__label {
    display: block;
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #9a9a9a;
    font-weight: 600;
    margin-bottom: 0.4rem;
  }
  .auth-form__input {
    width: 100%;
    padding: 0.75rem 1rem;
    border: 1px solid #e2e2e2;
    border-radius: 10px;
    font-size: 1rem;
    box-sizing: border-box;
    transition: border-color .2s ease;
  }
  .auth-form__input:focus {
    outline: none;
    border-color: #b8934a;
  }
  .auth-form__forgot {
    text-align: right;
    margin: -0.4rem 0 1.1rem;
    font-size: 0.88rem;
  }
  .auth-form__forgot a { color: #b8934a; text-decoration: none; }
  .auth-form__forgot a:hover { text-decoration: underline; }
  .auth-form__submit {
    width: 100%;
    padding: 0.85rem 1rem;
    background: #b8934a;
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    margin-top: 0.5rem;
    transition: background .2s ease;
  }
  .auth-form__submit:hover { background: #a17e3c; }
  .auth-card__footer {
    margin-top: 1.75rem;
    font-size: 0.92rem;
    color: #6b6b6b;
  }
  .auth-card__footer a { color: #b8934a; font-weight: 600; text-decoration: none; }
  .auth-card__footer a:hover { text-decoration: underline; }
  @media (max-width: 480px) {
    .auth-card { padding: 1.75rem; }
  }
</style>
{% endblock %}
