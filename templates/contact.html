{% extends "base.html" %}

{% block content %}
<div class="container my-5">
    <h2 class="mb-4">Contact Us</h2>
    <p>Have questions about your delivery or need custom arrangements? Get in touch with us!</p>

    <div class="row mt-4">
        <div class="col-md-6 mb-4">
            <div class="card p-4 shadow-sm">
                <h4>Get in Touch</h4>
                <ul class="list-unstyled mt-3">
                    <li class="mb-2"><strong>Email:</strong> {{ admin_email }}</li>
                    <li class="mb-2"><strong>Support Hours:</strong> 24/7 Delivery Service</li>
                </ul>
            </div>
        </div>

        <div class="col-md-6">
            <div class="card p-4 shadow-sm">
                <h4>Send us a Message</h4>
                <form action="mailto:{{ admin_email }}" method="post" enctype="text/plain">
                    <div class="mb-3">
                        <label for="name" class="form-label">Your Name</label>
                        <input type="text" class="form-control" id="name" name="name" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Your Email</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>
                    <div class="mb-3">
                        <label for="message" class="form-label">Message</label>
                        <textarea class="form-control" id="message" name="message" rows="4" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Send Message</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
